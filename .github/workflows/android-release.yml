name: Android Release APKs (all ABIs)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          test "$(uname -m)" = x86_64
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare prerelease signing key
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/imirror-prerelease.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          keytool -list -keystore "$key_path" -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Assemble signed release APKs
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Assemble unsigned release APKs for non-tag builds
        if: ${{ ! (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and package release APKs
        env:
          APK_OUTPUT_DIR: app/build/outputs/apk/release
          PACKAGE_DIR: app/build/outputs/release-assets
          VERSION_NAME: 1.0.1-rc.1
          SIGNED_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_DIR"
          python3 - "$APK_OUTPUT_DIR" "$PACKAGE_DIR" "$VERSION_NAME" "$SIGNED_BUILD" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          from zipfile import ZipFile

          apk_dir = Path(sys.argv[1])
          package_dir = Path(sys.argv[2])
          version = sys.argv[3]
          signed_build = sys.argv[4].lower() == "true"
          abis = ("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
          native_names = (
              "libalac.so",
              "libdatastore_shared_counter.so",
              "libplayfair.so",
          )

          def verify_apk(path: Path, expected_libs: set[str]) -> None:
              if not path.is_file():
                  raise SystemExit(f"Missing expected release APK: {path}")
              with ZipFile(path) as archive:
                  corrupt = archive.testzip()
                  if corrupt:
                      raise SystemExit(f"Corrupt entry in {path}: {corrupt}")
                  entries = set(archive.namelist())
                  actual_libs = {
                      name for name in entries
                      if name.startswith("lib/") and name.endswith(".so")
                  }
                  if actual_libs != expected_libs:
                      raise SystemExit(
                          f"Unexpected native libraries in {path}: "
                          f"missing={sorted(expected_libs - actual_libs)}, "
                          f"extra={sorted(actual_libs - expected_libs)}"
                      )
                  required_notices = {
                      "assets/licenses/Apache-2.0.txt",
                      "assets/licenses/NOTICE.md",
                  }
                  missing = required_notices - entries
                  if missing:
                      raise SystemExit(
                          f"Missing license files in {path}: {sorted(missing)}"
                      )
                  if archive.read("assets/licenses/Apache-2.0.txt") != Path("LICENSES/Apache-2.0.txt").read_bytes():
                      raise SystemExit("Bundled Apache license does not match source")
                  if archive.read("assets/licenses/NOTICE.md") != Path("NOTICE.md").read_bytes():
                      raise SystemExit("Bundled NOTICE does not match source")

          print("Release APK outputs:", sorted(path.name for path in apk_dir.glob("*.apk")))

          def locate_apk(stem: str) -> Path:
              matches = list(apk_dir.glob(f"{stem}*.apk"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one APK matching {stem}*.apk; found {matches}")
              source = matches[0]
              unsigned = source.name.endswith("-unsigned.apk")
              if unsigned == signed_build:
                  raise SystemExit(
                      f"Unexpected signing suffix for {source.name}: signed_build={signed_build}"
                  )
              return source

          asset_suffix = "release" if signed_build else "release-unsigned"
          for abi in abis:
              source = locate_apk(f"app-{abi}-release")
              expected = {f"lib/{abi}/{name}" for name in native_names}
              verify_apk(source, expected)
              shutil.copyfile(source, package_dir / f"iMirror-{version}-{abi}-{asset_suffix}.apk")

          universal = locate_apk("app-universal-release")
          expected_universal = {
              f"lib/{abi}/{name}" for abi in abis for name in native_names
          }
          verify_apk(universal, expected_universal)
          shutil.copyfile(
              universal,
              package_dir / f"iMirror-{version}-universal-{asset_suffix}.apk",
          )
          print(f"Verified {len(abis)} ABI APKs and one universal APK; signed={signed_build}.")
          PY

      - name: Verify signed APKs for prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          PACKAGE_DIR: app/build/outputs/release-assets
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in "$PACKAGE_DIR"/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done

      - name: Archive exact source revision and checksums
        env:
          PACKAGE_DIR: app/build/outputs/release-assets
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="imirror-${GITHUB_SHA}/" "$GITHUB_SHA" \
            > "$PACKAGE_DIR/imirror-source-${GITHUB_SHA}.tar.gz"
          (
            cd "$PACKAGE_DIR"
            sha256sum ./*.apk ./*.tar.gz > SHA256SUMS.txt
          )
          cat "$PACKAGE_DIR/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imirror-release-apks-${{ github.sha }}
          path: app/build/outputs/release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub prerelease assets
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIR: app/build/outputs/release-assets
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="Release-variant APKs for armeabi-v7a, arm64-v8a, x86, x86_64, and universal. Signed with the new iMirror prerelease certificate. This certificate differs from earlier builds; uninstall an older install before installing if Android reports a signature mismatch."
          new_source="imirror-source-${GITHUB_SHA}.tar.gz"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE_DIR"/* --clobber
            gh release edit "$tag" --title "iMirror $tag" --notes "$notes" --prerelease
            mapfile -t old_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]}"; do
              case "$asset" in
                *-debug.apk|imirror-source-*.tar.gz)
                  if [[ "$asset" != "$new_source" ]]; then
                    gh release delete-asset "$tag" "$asset" --yes
                  fi
                  ;;
              esac
            done
          else
            gh release create "$tag" "$PACKAGE_DIR"/* \
              --verify-tag --prerelease --title "iMirror $tag" --notes "$notes"
          fi
